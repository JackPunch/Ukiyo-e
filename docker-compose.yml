# Local deployment: nginx-served frontend + Fastify API.
#
#   docker compose up --build     # then open http://localhost:8080
#   docker compose down
#
# Build context is the repo root for both images (npm-workspaces monorepo).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Only reachable by other services (nginx proxies /api here). Uncomment to
    # also hit the API directly from the host, e.g. http://localhost:3000/api/health.
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    environment:
      # SQLite file lives on the mounted volume so it survives container restarts.
      DATABASE_URL: /app/data/ukiyo-e.sqlite
      # Session JWT signing key (HS256), at least 32 characters. Override it in
      # a local .env for anything beyond a throwaway demo.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-replace-0123456789abcdef}
      JWT_TTL: ${JWT_TTL:-7d}
      # Bootstrap admin: created on first start, promoted (never password-reset)
      # afterwards.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      # Required by POST /api/tasks; never bake this secret into the image.
      KIE_API_KEY: ${KIE_API_KEY:?KIE_API_KEY must be set in .env}
      # This deployment is plain HTTP (http://localhost:8080), so the session
      # cookie must not carry Secure — browsers would drop it. Set to true when
      # putting this behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - api-data:/app/data
    healthcheck:
      # Use 127.0.0.1 (not localhost): inside the container `localhost` resolves
      # to IPv6 ::1 first, but Fastify binds IPv4 only -> connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
