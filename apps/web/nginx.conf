# Dropped into /etc/nginx/conf.d/, so this is a `server` block (not a full config).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed files under /assets/ → safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the `api` service. Same origin for the browser, so no
    # CORS is needed and the frontend can keep the relative default VITE_API_BASE (/api).
    # No trailing path on proxy_pass → the original URI (incl. /api) is preserved.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for unknown paths so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
